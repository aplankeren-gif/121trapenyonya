<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

/* Background blur total */
.bg{
    position:fixed;
    inset:0;
    overflow:hidden;
}

.bg video{
    width:100%;
    height:100%;
    object-fit:cover;
    filter:blur(25px) brightness(.45);
    transform:scale(1.2);
}

/* Video utama (Diberi Blur Dikit) */
.main-video{
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
}

.main-video video{
    height:100vh;
    max-width:100%;
    object-fit:contain;
    border-radius:20px;
    box-shadow:0 0 50px rgba(0,0,0,.5);
    filter: blur(4px); /* 🔴 EFEK BLUR DIKIT PADA VIDEO UTAMA */
}

/* Overlay */
.overlay{
    position:fixed;
    inset:0;
    background:linear-gradient(to top,rgba(0,0,0,.7),rgba(0,0,0,.15));
}

/* Konten */
.content{
    position:absolute;
    left:50%;
    bottom:50px;
    transform:translateX(-50%);
    width:90%;
    max-width:450px;
    text-align:center;
    color:white;
    z-index: 10;
}

h1{
    font-size:34px;
    margin-bottom:10px;
}

p{
    opacity:.9;
    margin-bottom:25px;
    line-height:1.5;
}

.btn{
    display:block;
    text-decoration:none;
    background:#25D366;
    color:#fff;
    padding:18px;
    border-radius:50px;
    font-size:22px;
    font-weight:bold;
    transition:.3s;
    cursor:pointer;
    border:none;
    width:100%;
}

.btn:hover{
    transform:scale(1.04);
}

@media(max-width:768px){
    .main-video video{
        width:100%;
        height:100%;
        object-fit:cover;
        border-radius:0;
    }

    .content{
        bottom:35px;
    }

    h1{
        font-size:28px;
    }
}
</style>
